<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>奶蛙去哪了？｜上學大作戰</title><style>
:root{font-family:ui-sans-serif,system-ui,"Noto Sans TC",sans-serif;color:#3b322d;background:#faf5ed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 5%,#ffedd4,transparent 45%),#faf5ed;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e5a540;outline-offset:3px}.app{max-width:1120px;margin:auto;padding:22px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-weight:1000;letter-spacing:1px;font-size:clamp(19px,3vw,29px)}.tag{background:#fff;border:1px solid #edddc8;padding:8px 14px;border-radius:40px;color:#896b48;font-size:13px}.board{display:grid;grid-template-columns:minmax(0,600px) minmax(250px,1fr);gap:23px;align-items:start}.scene-wrap{min-width:0}.scene{width:100%;position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#e8d9c8;box-shadow:0 16px 44px #694c3020;isolation:isolate}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.object{position:absolute;display:block;object-fit:contain;cursor:pointer;filter:drop-shadow(0 2px 3px #27211e70);transform:translate(-50%,-50%);transition:transform .18s,opacity .2s;z-index:4;user-select:none;-webkit-user-drag:none}.object:hover{transform:translate(-50%,-50%) scale(1.09) rotate(-4deg)}.object.found{animation:pop .4s ease forwards;pointer-events:none}.object.hinted{filter:drop-shadow(0 0 13px #ffe600) drop-shadow(0 0 7px #ffffff);animation:hint .8s infinite alternate}@keyframes hint{to{filter:drop-shadow(0 0 22px #ffd300) drop-shadow(0 0 14px #ffffff)}}@keyframes pop{to{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(13deg)}}.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}.pill{background:white;border:1px solid #eddcce;border-radius:15px;padding:9px 13px;font-size:14px;font-weight:700}.pill strong{color:#c47727}.panel{background:#fffdf9;border:1px solid #eddfcf;padding:24px;border-radius:24px;box-shadow:0 7px 28px #684a2912}.panel h2{margin:0 0 7px;font-size:25px}.muted{color:#937e6b;font-size:14px;line-height:1.7}.targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 20px}.target{background:#fff6e9;border:1px solid #f1e0c8;min-height:78px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:17px;font-weight:750;gap:4px}.target img{height:42px;width:70px;object-fit:contain}.target.ok{background:#e8f6e9;border-color:#b9dfbd;color:#4b8059;text-decoration:line-through}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:15px;background:#eaa753;color:#fff;padding:13px 17px;font-weight:900;min-height:48px}.btn:hover{filter:brightness(.97)}.btn.secondary{color:#795d44;background:#f4e7d4}.btn:disabled{opacity:.48;cursor:default}.toast{background:#3f382fda;color:#fff;position:absolute;left:50%;top:13%;transform:translateX(-50%);border-radius:14px;padding:11px 17px;z-index:7;font-weight:800;white-space:nowrap;max-width:90%;text-align:center}.dialog-layer{position:absolute;inset:0;z-index:15;background:#221a176b;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}.dialog{background:#fff9ed;border:3px solid #f9d89b;border-radius:21px;padding:18px;box-shadow:0 10px 40px #24180e55}.speaker{font-size:13px;font-weight:900;color:#be7a26;margin-bottom:8px}.line{font-size:clamp(17px,2.5vw,23px);line-height:1.55;min-height:66px;font-weight:800}.dialog footer{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:12px}.mini{border:0;background:none;color:#97755a;text-decoration:underline;font-size:13px}.center-layer{position:absolute;z-index:20;inset:0;background:#211a15a6;display:flex;align-items:center;justify-content:center;padding:22px}.modal{background:#fff9ef;border:3px solid #f4dbab;border-radius:25px;padding:30px 20px;text-align:center;max-width:420px;width:100%;box-shadow:0 16px 48px #18130f5c}.modal h1{font-size:clamp(26px,4vw,35px);margin:7px 0 11px}.modal p{color:#886c51;line-height:1.7;margin:0 0 21px}.hero{max-height:190px;max-width:65%;object-fit:contain;filter:drop-shadow(0 4px 5px #3333)}.footnote{margin-top:18px;text-align:center;font-size:12px;color:#a58f7d}.hidden{display:none!important}@media(max-width:760px){.board{grid-template-columns:1fr}.scene-wrap{max-width:600px;margin:auto;width:100%}.panel{max-width:600px;width:100%;margin:auto;padding:18px}.top{flex-wrap:wrap}.app{padding:12px 10px 30px}.scene{border-radius:17px}.targets{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.target{font-size:11px;min-height:62px}.target img{height:33px;width:100%}.dialog-layer{padding:10px}.dialog{padding:12px}}
</style></head><body><div class="app"><header class="top"><div class="brand">🐸 奶蛙去哪了？</div><div class="tag">上學大作戰 · 4 關尋物遊戲</div></header><main class="board"><section class="scene-wrap"><div class="status"><span class="pill" id="stagePill">第 1 關</span><span class="pill">⏱ <strong id="clock">90</strong> 秒</span><span class="pill">完成 <strong id="progress">0 / 4</strong></span></div><div class="scene" id="scene"><img class="background" id="sceneBg" alt="遊戲場景"><div class="toast hidden" id="toast" role="status"></div><div class="dialog-layer hidden" id="dialogLayer"><div class="dialog"><div class="speaker" id="speaker"></div><div class="line" id="line"></div><footer><button class="mini" id="skip">跳過劇情</button><button class="btn" id="nextLine">下一句 →</button></footer></div></div><div class="center-layer" id="modalLayer"><div class="modal"><img class="hero" id="modalImg" alt="奶蛙"><h1 id="modalTitle">奶蛙去哪了？</h1><p id="modalText">上課快遲到了，先找齊所有東西！</p><button class="btn" id="modalBtn">開始冒險 →</button></div></div></div></section><aside class="panel"><div class="muted" id="subhead">尋找任務</div><h2 id="mission">出門前的混亂</h2><div class="muted" id="desc">找齊手機、鑰匙、耳機和行動電源，準備出門上課！</div><div class="targets" id="targets"></div><div class="actions"><button class="btn" id="hintBtn">💡 提示 (2)</button><button class="btn secondary" id="restartBtn">↻ 重玩本關</button></div><p class="muted" style="margin:18px 0 0">玩法：仔細觀察畫面，點擊藏起來的物品或奶蛙。劇情對話期間不會扣時間。</p></aside></main><div class="footnote">單檔網頁遊戲 · 可使用滑鼠或觸控操作 · 圖片放在 images/ 資料夾，可自行替換</div></div><script>
const ASSETS={
  "dorm": "images/dorm.png",
  "hall": "images/hall.png",
  "campus": "images/campus.png",
  "earbuds": "images/earbuds.png",
  "phone": "images/phone.png",
  "keys": "images/keys.png",
  "power": "images/power.png",
  "frog": "images/frog.png",
  "frogRun": "images/frogRun.png",
  "frogUp": "images/frogUp.png",
  "frogSit": "images/frogSit.png"
};
const $=id=>document.getElementById(id);
const LEVELS=[
 {name:'出門前的混亂',bg:'dorm',intro:[['主角','啊啊啊！怎麼已經這個時間了！'],['主角','手機、鑰匙、耳機……昨天到底丟去哪裡？'],['主角','先把東西找齊，不然真的來不及！']],outro:[['主角','呼！終於找齊了！'],['主角','奶蛙！快點起床，我們要去上學了！'],['主角','……奇怪？奶蛙人呢？！']],description:'在宿舍找齊 4 件上課要帶的東西。',items:[
  {id:'phone',name:'手機',places:[[12,51,11],[66,48,10],[41,64,10]],say:'原來在這裡！'},
  {id:'keys',name:'鑰匙',places:[[34,68,13],[64,81,11],[11,75,11]],say:'差點被鎖在外面……'},
  {id:'earbuds',name:'無線耳機',places:[[67,58,11],[27,45,10],[47,36,9]],say:'昨天睡前果然亂放。'},
  {id:'power',name:'行動電源',places:[[72,73,14],[22,59,13],[52,49,12]],say:'太好了！今天不用怕沒電。'}]},
 {name:'奶蛙失蹤事件',bg:'dorm',intro:[['主角','奶蛙！你躲去哪裡了？'],['主角','不要跟我說你又想翹課！'],['奶蛙','……嘿嘿。']],outro:[['主角','找到你了！快點出來！'],['奶蛙','嘿嘿，被你發現了。'],['主角','我們真的要遲到了！'],['奶蛙','我去拿一下東西！先走一步囉～'],['主角','欸？！怎麼又跑掉了！']],description:'奶蛙還在宿舍！快把他找出來。',items:[{id:'frog',name:'奶蛙',places:[[72,31,18],[13,37,17],[49,52,16],[68,67,17]],say:'抓到你了！'}]},
 {name:'宿舍大逃亡',bg:'hall',intro:[['主角','奶蛙！你給我站住！'],['奶蛙','你找不到我～'],['主角','有本事就不要被我抓到！']],outro:[['主角','哈哈！抓到了！'],['奶蛙','欸？怎麼這麼快！'],['主角','走啦，老師都快點名了！'],['奶蛙','可是……我突然有點餓！'],['奶蛙','我去外面找吃的！'],['主角','喂！回來啊啊啊！']],description:'他又躲進宿舍公共區域，找出奶蛙！',items:[{id:'frogRun',name:'奶蛙',places:[[65,41,14],[14,58,16],[43,38,13],[79,73,14]],say:'終於抓到你！'}]},
 {name:'校園最後追逐戰',bg:'campus',intro:[['主角','明明只是去上課，怎麼變成抓奶蛙？'],['奶蛙','最後一次！找到我就跟你去！'],['主角','你最好說話算話！']],outro:[['主角','終於！這次不准再跑了！'],['奶蛙','好啦，我投降。'],['奶蛙','其實我有件事一直沒告訴你……'],['主角','什麼事？'],['奶蛙','今天不是星期六嗎？'],['主角','……蛤？？？']],description:'最後一關！在校園裡把奶蛙找回來。',items:[{id:'frogUp',name:'奶蛙',places:[[38,56,13],[76,44,12],[10,35,13],[64,75,13]],say:'終於逮到你啦！'}]}
];
let level=0, found=new Set(),remaining=90,hints=2,phase='home',timer=null,dialogQueue=[],dialogIndex=0,dialogDone=null,toastTimer=null,secret=[];
function stopClock(){clearInterval(timer);timer=null}
function showToast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1250)}
function showModal(title,body,button,callback,hero='frogSit'){$('dialogLayer').classList.add('hidden');$('modalLayer').classList.remove('hidden');$('modalTitle').textContent=title;$('modalText').textContent=body;$('modalBtn').textContent=button;$('modalImg').src=ASSETS[hero];$('modalBtn').onclick=callback}
function hideModal(){$('modalLayer').classList.add('hidden')}
function dialog(lines,done){phase='dialog';stopClock();dialogQueue=lines;dialogIndex=0;dialogDone=done;$('dialogLayer').classList.remove('hidden');showLine()}
function showLine(){const [who,words]=dialogQueue[dialogIndex];$('speaker').textContent=who;$('line').textContent=words;$('nextLine').textContent=dialogIndex===dialogQueue.length-1?'繼續 →':'下一句 →'}
function advance(){dialogIndex++;if(dialogIndex>=dialogQueue.length){$('dialogLayer').classList.add('hidden');let done=dialogDone;dialogDone=null;if(done)done()}else showLine()}
function skip(){dialogIndex=dialogQueue.length-1;advance()}
function resetLevel(n){stopClock();level=n;found=new Set();remaining=90;hints=2;phase='intro';$('clock').textContent=remaining;$('sceneBg').src=ASSETS[LEVELS[level].bg];$('sceneBg').alt=LEVELS[level].name;document.querySelectorAll('.object').forEach(el=>el.remove());$('mission').textContent=LEVELS[level].name;$('desc').textContent=LEVELS[level].description;$('subhead').textContent='第 '+(level+1)+' 關的任務';$('stagePill').textContent=`第 ${level+1} / 4 關`;
// Use one of several predefined positions, avoiding overlapping pieces.
let used=[];secret=LEVELS[level].items.map((item,index)=>{const candidates=[...item.places].sort(()=>Math.random()-.5);const place=candidates.find(p=>used.every(q=>Math.hypot((p[0]-q[0]),(p[1]-q[1]))>22))||candidates[0];used.push(place);return {...item,place}});
for(const item of secret){const el=document.createElement('img');el.src=ASSETS[item.id];el.className='object';el.id='obj-'+item.id;el.alt='尋找目標：'+item.name;el.title=item.name;el.setAttribute('role','button');el.tabIndex=0;el.setAttribute('aria-label','找到'+item.name);el.style.left=item.place[0]+'%';el.style.top=item.place[1]+'%';el.style.width=item.place[2]+'%';el.style.maxHeight='24%';el.addEventListener('click',()=>pick(item));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(item)}});$('scene').appendChild(el)}renderTargets();dialog(LEVELS[level].intro,startPlay)}
function renderTargets(){$('progress').textContent=found.size+' / '+secret.length;$('targets').innerHTML='';for(const item of secret){const div=document.createElement('div');div.className='target'+(found.has(item.id)?' ok':'');div.innerHTML=`<img alt="" src="${ASSETS[item.id]}"><span>${found.has(item.id)?'✓ ':''}${item.name}</span>`;$('targets').appendChild(div)}$('hintBtn').textContent=`💡 提示 (${hints})`;$('hintBtn').disabled=hints<=0||phase!=='play'}
function startPlay(){phase='play';renderTargets();stopClock();timer=setInterval(()=>{if(phase!=='play')return;remaining=Math.max(0,remaining-1);$('clock').textContent=remaining;if(remaining<=0){stopClock();phase='fail';renderTargets();showModal('時間到了！','差一點就成功了，再試一次吧！','重試這一關',()=>{hideModal();resetLevel(level)},'frogSit')}},1000)}
function pick(item){if(phase!=='play'||found.has(item.id))return;found.add(item.id);const el=$('obj-'+item.id);el.classList.remove('hinted');el.classList.add('found');showToast('✓ '+item.say);renderTargets();if(found.size===secret.length){stopClock();phase='outro';setTimeout(()=>{dialog(LEVELS[level].outro,()=>{if(level===LEVELS.length-1){phase='end';showModal('上學大作戰……大失敗？','辛苦找了一整個早上，結果今天根本不用上課！奶蛙：所以我就說不用急嘛～','再玩一次',()=>{hideModal();resetLevel(0)},'frogSit')}else{phase='next';showModal('第 '+(level+1)+' 關完成！','奶蛙還在亂跑！快追上去！','前往下一關 →',()=>{hideModal();resetLevel(level+1)},'frogRun')}})},680)}}
$('nextLine').onclick=advance;$('skip').onclick=skip;
$('hintBtn').onclick=()=>{if(phase!=='play'||hints<=0)return;const item=secret.find(x=>!found.has(x.id));if(!item)return;hints--;renderTargets();const node=$('obj-'+item.id);node.classList.add('hinted');showToast('提示：注意發亮的位置！');setTimeout(()=>node.classList.remove('hinted'),2200)};
$('restartBtn').onclick=()=>{hideModal();resetLevel(level)};
$('sceneBg').src=ASSETS.dorm;$('modalImg').src=ASSETS.frogSit;$('modalBtn').onclick=()=>{hideModal();resetLevel(0)};
</script></body></html>
